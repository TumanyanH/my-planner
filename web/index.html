<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Planner</h1>
    <button id="profileBtn" class="round" aria-label="Profile" title="Profile">•</button>
    <button id="newBtn" class="primary round" aria-label="New task" title="New task">+</button>
  </div>
  <input id="search" type="search" placeholder="Search" aria-label="Search tasks" autocomplete="off" enterkeyhint="search">
</header>

<main>
  <form id="quick" autocomplete="off">
    <input id="quickInput" placeholder="Add a task…" aria-label="Quick add task" enterkeyhint="done">
    <button type="submit" class="primary">Add</button>
  </form>
  <p id="quickHint" class="hint">Try “Dentist <code>friday 3pm</code> <code>!3</code>” — a date or time in the title becomes the <b>planned</b> date. Add <code>by</code> or <code>due</code> (“Report <code>by monday</code>”) for a deadline. <code>!1</code>–<code>!4</code> sets importance.</p>
  <section id="list"></section>
</main>

<nav id="tabs" aria-label="Views"></nav>

<div id="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span>
  <button id="toastUndo" class="small">Undo</button>
</div>

<dialog id="taskDlg">
  <form method="dialog" id="taskForm">
    <h2 id="dlgTitle">New task</h2>
    <label>Title <input name="title" required autocomplete="off" enterkeyhint="done"></label>
    <label>Notes <textarea name="notes" rows="3"></textarea></label>
    <div class="row">
      <label>Planned date <input type="date" name="plannedDate"></label>
      <label>Planned time <input type="time" name="plannedTime"></label>
    </div>
    <div class="row">
      <label>Due <input type="datetime-local" name="due"></label>
      <label>Importance
        <select name="importance">
          <option value="1">1 · Low</option>
          <option value="2" selected>2 · Normal</option>
          <option value="3">3 · High</option>
          <option value="4">4 · Critical</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Repeats
        <select name="recur">
          <option value="none">Never</option>
          <option value="daily">Daily</option>
          <option value="weekdays">Weekdays</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </label>
      <label id="everyLabel">Every <input type="number" name="every" min="1" value="1" inputmode="numeric"></label>
    </div>
    <div class="actions">
      <button type="button" id="delBtn" class="destructive">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="profileDlg">
  <h2>Profile</h2>
  <label>Email <input id="profileEmail" type="text" value="" disabled></label>
  <div class="actions stack">
    <button type="button" id="settingsBtn">Edit general settings</button>
    <button type="button" id="signOutBtn" class="destructive">Sign out</button>
    <button type="button" id="profileClose">Close</button>
  </div>
</dialog>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <h2>General settings</h2>
    <label>Open on
      <select name="startView">
        <option value="dashboard">Dashboard</option>
        <option value="today">Today</option>
        <option value="upcoming">Upcoming</option>
        <option value="all">All</option>
      </select>
    </label>
    <label>Default importance for quick add
      <select name="importance">
        <option value="1">1 · Low</option>
        <option value="2">2 · Normal</option>
        <option value="3">3 · High</option>
        <option value="4">4 · Critical</option>
      </select>
    </label>
    <p class="hint">Saved on this device.</p>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" id="settingsCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="loginDlg">
  <h2>Sign in</h2>
  <div id="googleBtn" style="display:flex;justify-content:center;margin:4px 0 8px"></div>
  <p id="loginErr" class="error" hidden></p>
</dialog>

<dialog id="reDlg">
  <form method="dialog" id="reForm">
    <h2>Reschedule</h2>
    <label id="reLabel">New due <input type="datetime-local" name="due" required></label>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" id="reCancel">Cancel</button>
      <button type="submit" class="primary">Reschedule</button>
    </div>
  </form>
</dialog>

<script src="parse.js"></script>
<script src="app.js"></script>
</body>
</html>
